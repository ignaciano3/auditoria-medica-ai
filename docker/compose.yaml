services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: audit
      POSTGRES_PASSWORD: audit
      POSTGRES_DB: audit
    ports: ["5432:5432"]
    volumes:
      - "pgdata:/var/lib/postgresql/data"
      - "./init/01-create-test-db.sql:/docker-entrypoint-initdb.d/01-create-test-db.sql:ro"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audit"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio:/data"]

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minio minio123; do sleep 1; done;
      mc mb -p local/documents;
      "

  migrate:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["bun", "run", "--cwd", "packages/db", "db:migrate"]
    environment:
      DATABASE_URL: postgres://audit:audit@postgres:5432/audit
    depends_on:
      postgres:
        condition: service_healthy

  migrate-test:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["bun", "run", "--cwd", "packages/db", "db:migrate"]
    environment:
      DATABASE_URL: postgres://audit:audit@postgres:5432/audit_test
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["bun", "run", "apps/worker/src/index.ts"]
    environment:
      DATABASE_URL: postgres://audit:audit@postgres:5432/audit
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: documents
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: minio123
      # Local mode: LLM_PROVIDER=heuristic, OCR_PROVIDER=local, no OPENAI_API_KEY.
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_MODEL: ${LLM_MODEL:-gpt-5.6-terra}
      OCR_PROVIDER: ${OCR_PROVIDER:-tesseract}
      OCR_MODEL: ${OCR_MODEL:-gpt-5.6-luna}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      OPENCODE_API_KEY: ${OPENCODE_API_KEY:-}
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:-}
      DOCUMENT_RETENTION_DAYS: 30
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  minio:
