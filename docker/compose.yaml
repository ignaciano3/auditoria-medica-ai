services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: audit
      POSTGRES_PASSWORD: audit
      POSTGRES_DB: audit
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audit"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio:/data"]

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["bun", "run", "apps/worker/src/index.ts"]
    environment:
      DATABASE_URL: postgres://audit:audit@postgres:5432/audit
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: documents
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: minio123
      LLM_PROVIDER: openai
      LLM_MODEL: gpt-4.1
      OCR_PROVIDER: openai
      OCR_MODEL: gpt-4.1
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-replace-me}
      DOCUMENT_RETENTION_DAYS: 30
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

volumes:
  pgdata:
  minio:
